<!doctype html>
<html lang="en">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Gridiron QB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --ink:#f4f7fb; --muted:#9fb2c8; --panel:rgba(8,20,38,.86); --line:rgba(255,255,255,.14);
  --hot:#ff8a1f; --good:#35d07f; --warn:#ffd23f; --bad:#ff4d4d; --bg:#07111f;
  --A:#ffd23f; --B:#3fc5ff; --C:#ff5ca8;
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
.bebas{font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;letter-spacing:.04em}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
#ui > *{pointer-events:auto}
/* HUD */
#top{position:absolute;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));display:flex;gap:8px;align-items:stretch;pointer-events:none}
#top > *{pointer-events:auto}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 12px;display:flex;flex-direction:column;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pill small{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.pill b{font-family:'Bebas Neue',Impact,sans-serif;font-size:26px;line-height:1;letter-spacing:.04em;font-weight:400}
.icon{width:48px;min-width:48px;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
.icon svg{width:24px;height:24px}
#hMid{flex:1;align-items:center;text-align:center}
#pocket{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(8px,env(safe-area-inset-top)) + 64px);width:min(320px,60vw);height:10px;border-radius:6px;background:rgba(0,0,0,.45);overflow:hidden;border:1px solid var(--line);pointer-events:none}
#pocketFill{height:100%;width:0;background:linear-gradient(90deg,var(--good),var(--warn),var(--bad))}
#wind{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(8px,env(safe-area-inset-top)) + 64px);pointer-events:none}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));font-size:13px;font-weight:700;color:#dfe8f3;background:rgba(0,0,0,.45);padding:6px 12px;border-radius:10px;white-space:nowrap;pointer-events:none;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
/* aim + throw */
#pull{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#grab{position:absolute;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;border:3px dashed rgba(255,255,255,.85);display:grid;place-items:center;
  font-family:'Bebas Neue',Impact,sans-serif;font-size:18px;letter-spacing:.08em;color:#fff;text-shadow:0 1px 3px #000;background:rgba(255,138,31,.18);animation:pulse 1.4s ease-in-out infinite;touch-action:none}
#grab.hold{animation:none;background:rgba(255,138,31,.35);border-style:solid}
@keyframes pulse{50%{transform:scale(1.08)}}
.chip{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:3px solid;display:grid;place-items:center;
  font-family:'Bebas Neue',Impact,sans-serif;font-size:24px;color:#08101c;touch-action:none;box-shadow:0 3px 10px rgba(0,0,0,.45)}
.chip.lock{outline:4px solid #fff;outline-offset:2px}
.chip.hoop{width:auto;min-width:46px;padding:0 8px;border-radius:14px;font-size:20px;color:#fff;background:rgba(0,0,0,.55)}
/* banner */
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;font-family:'Bebas Neue',Impact,sans-serif;font-size:min(16vw,110px);line-height:.9;
  letter-spacing:.04em;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px rgba(0,0,0,.5);opacity:0}
#banner small{display:block;font-size:.34em;letter-spacing:.1em;opacity:.95}
#banner.show{animation:ban 2.2s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.06)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
/* big buttons */
.cta{background:var(--hot);color:#1b0d00;border-radius:18px;font-family:'Bebas Neue',Impact,sans-serif;font-size:32px;letter-spacing:.08em;padding:12px 34px;box-shadow:0 6px 0 #b35600,0 10px 24px rgba(0,0,0,.4)}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 #b35600}
.ghost{background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:14px;padding:10px 18px;font-weight:800}
#bHike{position:absolute;left:50%;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 40px);transform:translateX(-50%);font-size:44px;padding:14px 56px}
#bHike:active{transform:translateX(-50%) translateY(4px)}
/* sheets */
.sheet{position:absolute;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:min(980px,calc(100vw - 20px));max-height:calc(100vh - 90px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);touch-action:pan-y}
.sheet h2{margin:0 0 10px;font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:28px;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sheet h2 span{font-size:18px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}
.card{background:linear-gradient(#1b6b35,#145a2b);border:2px solid rgba(255,255,255,.18);border-radius:16px;padding:6px 6px 8px;text-align:center}
.card:active{transform:scale(.96)}
.card svg{width:100%;height:auto;display:block}
.card div{font-family:'Bebas Neue',Impact,sans-serif;font-size:22px;letter-spacing:.05em;margin-top:2px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
/* lobby */
#lobby{position:absolute;inset:0;overflow:auto;background:linear-gradient(180deg,rgba(4,10,20,.55),rgba(4,10,20,.92) 60%);touch-action:pan-y;
  padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:980px;margin:0 auto}
.brand{font-family:'Bebas Neue',Impact,sans-serif;font-size:min(20vw,96px);line-height:.9;letter-spacing:.04em;text-align:center;margin:8px 0 2px;text-shadow:0 5px 0 rgba(0,0,0,.4)}
.brand b{color:var(--hot);font-weight:400}
.tag{text-align:center;color:var(--muted);font-weight:700;margin-bottom:16px}
.lab{font-family:'Bebas Neue',Impact,sans-serif;font-size:22px;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:760px){.modes{grid-template-columns:repeat(2,1fr)}}
.mode{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px 12px;text-align:left;min-height:124px;display:flex;flex-direction:column;gap:6px}
.mode.on{border-color:var(--hot);box-shadow:0 0 0 3px rgba(255,138,31,.25)}
.mode svg{width:44px;height:44px}
.mode b{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:26px;letter-spacing:.05em;line-height:1}
.mode span{font-size:13px;color:var(--muted);font-weight:600;line-height:1.3}
.mode em{font-style:normal;font-size:12px;font-weight:800;color:var(--warn);margin-top:auto}
.stads{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:760px){.stads{grid-template-columns:repeat(2,1fr)}}
.stad{border:2px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;background:#000}
.stad.on{border-color:var(--hot);box-shadow:0 0 0 3px rgba(255,138,31,.25)}
.stad i{display:block;height:74px}
.stad b{display:block;padding:8px 10px;font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:20px;letter-spacing:.05em;background:var(--panel)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 18px;font-weight:800}
.seg button.on{border-color:var(--hot);color:#fff;background:rgba(255,138,31,.2)}
.teams{display:flex;gap:10px;flex-wrap:wrap}
.team{width:52px;height:52px;border-radius:50%;border:3px solid rgba(255,255,255,.25)}
.team.on{border-color:#fff;box-shadow:0 0 0 3px var(--hot)}
.how{color:#c9d6e5;font-size:14px;line-height:1.55;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-top:8px}
.how b{color:#fff}
.go{display:flex;justify-content:center;margin:22px 0 10px}
#summary .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:6px 0 14px}
#summary .stats div{background:rgba(255,255,255,.06);border-radius:14px;padding:10px;text-align:center}
#summary .stats small{display:block;color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
#summary .stats b{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:34px}
.newbest{color:var(--warn);font-family:'Bebas Neue',Impact,sans-serif;font-size:26px;text-align:center;letter-spacing:.06em}
.qbrow{display:flex;gap:12px;flex-wrap:wrap}
.qbrow label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.qbrow input{font-family:'Bebas Neue',Impact,sans-serif;font-size:30px;letter-spacing:.08em;color:#fff;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:6px 14px;width:260px;max-width:70vw;user-select:text;-webkit-user-select:text;touch-action:manipulation}
.qbrow label:last-child input{width:100px;text-align:center}
.qbrow input:focus{outline:none;border-color:var(--hot)}
.credits{font-size:11px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.5}
</style>

<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="top" hidden>
    <button class="icon" id="bMenu" aria-label="Menu"></button>
    <div class="pill" id="hLeft"><small id="hLeftL">Score</small><b id="hLeftV">0</b></div>
    <div class="pill" id="hMid"><small id="hMidL"></small><b id="hMidV"></b></div>
    <div class="pill" id="hRight"><small id="hRightL"></small><b id="hRightV"></b></div>
    <button class="icon" id="bMute" aria-label="Sound"></button>
  </div>
  <div id="pocket" hidden><div id="pocketFill"></div></div>
  <div id="wind" class="pill" hidden><small>Wind</small><b id="windV"></b></div>
  <svg id="pull"></svg>
  <div id="chips"></div>
  <div id="grab" hidden>PULL</div>
  <div id="banner"></div>
  <div id="hint" hidden></div>
  <button class="cta" id="bHike" hidden>HIKE!</button>
  <div class="sheet" id="playbook" hidden></div>
  <div class="sheet" id="fourth" hidden></div>
  <div class="sheet" id="summary" hidden></div>
  <div id="lobby"></div>
</div>
<script>/*__SOUNDS__*/</script>
<script type="module">
import * as THREE from 'three';
const $ = s => document.querySelector(s);
const V3 = THREE.Vector3;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const R = Math.random;
const pick = a => a[Math.floor(R() * a.length)];
const DEG = Math.PI / 180;

/* ================= constants (1 world unit = 1 yard) ================= */
const G = 10.73;               // gravity, yd/s^2
const HALF_W = 160 / 6;        // half the field width (53.33 yd)
const REL_H = 2.0;             // ball release height
const CATCH_H = 1.3;           // chest height receivers catch at
const VMAX = 8.6;              // receiver top speed, yd/s
const ACC_T = 0.7;             // seconds to top speed
const POST_Z = 110, BAR_H = 10 / 3, POST_HALF = 18.5 / 6 / 2;
const DIFFS = {
  rookie: { name: 'Rookie', def: .78, react: .5, pocket: 5.5, catchR: 1.7, defR: 1.15, catchP: .97, intP: .22, lean: .5, noise: .004, chips: 'track', marker: true, routesLive: true, windMax: 5 },
  pro:    { name: 'Pro', def: .88, react: .32, pocket: 4.5, catchR: 1.4, defR: 1.25, catchP: .92, intP: .42, lean: .8, noise: .012, chips: 'snap', marker: true, routesLive: false, windMax: 10 },
  allpro: { name: 'All-Pro', def: .96, react: .2, pocket: 3.6, catchR: 1.15, defR: 1.3, catchP: .87, intP: .6, lean: 1, noise: .02, chips: 'none', marker: false, routesLive: false, windMax: 15 }
};
const TEAMS = [
  { c: '#d62828', p: '#f2f2f2', h: '#d62828' }, { c: '#1d4ed8', p: '#e5e7eb', h: '#1d4ed8' }, { c: '#15803d', p: '#f5f5f4', h: '#f5b301' },
  { c: '#f97316', p: '#1f2937', h: '#f97316' }, { c: '#7c3aed', p: '#f5b301', h: '#7c3aed' }, { c: '#111827', p: '#f5b301', h: '#f5b301' }
];
const RCOL = { A: '#ffd23f', B: '#3fc5ff', C: '#ff5ca8' };
// route waypoints as [yards toward the outside sideline, yards downfield]
const ROUTES = {
  go:     { pts: [[0, 45]] },
  slant:  { pts: [[0, 3], [-9, 12], [-26, 32]] },
  out:    { pts: [[0, 8], [8, 8.6], [20, 9.2]] },
  curl:   { pts: [[0, 11], [-1, 9]], stop: true },
  post:   { pts: [[0, 11], [-9, 24], [-16, 42]] },
  corner: { pts: [[0, 11], [8, 22], [13, 34]] },
  drag:   { pts: [[0, 2], [-12, 5], [-36, 6]] },
  wheel:  { pts: [[3, 1], [7, 4], [8, 42]] }
};
const PLAYS = [
  { name: 'Slant City', r: [['A', -18, 'slant'], ['B', 18, 'slant'], ['C', 8, 'drag']] },
  { name: 'Deep Shot', r: [['A', -18, 'go'], ['B', 18, 'post'], ['C', 8, 'curl']] },
  { name: 'Sticks', r: [['A', -18, 'out'], ['B', 18, 'curl'], ['C', -8, 'out']] },
  { name: 'Corner Fade', r: [['A', -18, 'corner'], ['B', 18, 'go'], ['C', 8, 'drag']] },
  { name: 'Mesh', r: [['A', -18, 'drag'], ['B', 18, 'drag'], ['C', 8, 'go']] },
  { name: 'Wheel', r: [['A', -18, 'post'], ['B', 18, 'curl'], ['C', 8, 'wheel']] },
  { name: 'Hail Mary', r: [['A', -18, 'go'], ['B', 18, 'go'], ['C', 8, 'go']] },
  { name: 'Quick Outs', r: [['A', -18, 'out'], ['B', 18, 'out'], ['C', 8, 'slant']] }
];
const STADS = {
  pro:    { name: 'Pro Stadium', sky: ['#4f9cf0', '#cfe6ff'], fog: '#cfe6ff', grass: ['#3d9a3b', '#358a34'], ground: '#2f6f2e', stands: '#59616e', seats: '#2b5fa8', wall: null, light: 'day', crowd: .55, css: 'linear-gradient(#4f9cf0,#cfe6ff 55%,#3d9a3b 56%)' },
  friday: { name: 'Friday Night Lights', sky: ['#050a22', '#1c2a5c'], fog: '#0d1633', grass: ['#2f7d31', '#29702b'], ground: '#9a3b2b', stands: '#8a919c', seats: '#b8bec8', light: 'night', towers: true, crowd: .4, css: 'radial-gradient(circle at 20% 20%,#fff8 0 6%,transparent 7%),linear-gradient(#050a22,#1c2a5c 55%,#2f7d31 56%)' },
  snow:   { name: 'Snow Bowl', sky: ['#8f99a4', '#dfe4e8'], fog: '#d4dbe0', grass: ['#6f9a6b', '#679162'], ground: '#e9eef1', stands: '#5d646d', seats: '#7a2330', light: 'overcast', snow: true, crowd: .35, css: 'radial-gradient(circle at 30% 30%,#fff 0 2%,transparent 3%),radial-gradient(circle at 70% 50%,#fff 0 2%,transparent 3%),linear-gradient(#8f99a4,#dfe4e8 55%,#6f9a6b 56%)' },
  dome:   { name: 'Desert Dome', sky: ['#1a1410', '#3a2a1c'], fog: '#2a2018', grass: ['#2fb34a', '#28a342'], ground: '#1f7a34', stands: '#6b4f36', seats: '#c2410c', light: 'indoor', dome: true, crowd: .75, css: 'radial-gradient(ellipse at 50% 0,#ffd9a0aa,transparent 60%),linear-gradient(#3a2a1c,#6b4f36 55%,#2fb34a 56%)' }
};

/* ================= storage ================= */
const KEY = 'gridiron-qb-v1';
const save = { best: { game: 0, drill: 0, fg: 0, fgLong: 0, toss: 0 }, st: { stadium: 'pro', diff: 'rookie', team: 1, muted: false, mode: 'game', name: '', num: 12 } };
try { const o = JSON.parse(localStorage.getItem(KEY) || 'null'); if (o) { Object.assign(save.best, o.best || {}); Object.assign(save.st, o.st || {}); } } catch (e) {}
if (!STADS[save.st.stadium]) save.st.stadium = 'pro';
if (!DIFFS[save.st.diff]) save.st.diff = 'rookie';
if (!TEAMS[save.st.team]) save.st.team = 1;
const cleanName = v => String(v || '').toUpperCase().replace(/[^A-Z .'-]/g, '').slice(0, 12).trim();
const cleanNum = v => { const n = parseInt(v, 10); return Number.isFinite(n) ? clamp(n, 0, 99) : 12; };
save.st.name = cleanName(save.st.name); save.st.num = cleanNum(save.st.num);
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };

/* ================= audio ================= */
let AC = null, master = null, crowdSrc = null, crowdGain = null, inGame = false;
const BUF = {};
function ac() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const comp = AC.createDynamicsCompressor(); master = AC.createGain(); master.gain.value = .9; master.connect(comp); comp.connect(AC.destination);
      for (const [k, b64] of Object.entries(window.SOUND_CLIPS || {})) {
        const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);

      }
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function clip(name, { vol = 1, rate = 1, when = 0 } = {}) {
  if (!AC || save.st.muted || !BUF[name]) return false;
  const s = AC.createBufferSource(), g = AC.createGain(); s.buffer = BUF[name]; s.playbackRate.value = rate; g.gain.value = vol;
  s.connect(g); g.connect(master); s.start(AC.currentTime + when); return true;
}
function tone(f, dur, type = 'sine', vol = .08, f2) {
  if (!AC || save.st.muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .05);
}
function startCrowd() {
  if (!AC || !BUF.crowd || crowdSrc) return;
  crowdSrc = AC.createBufferSource(); crowdSrc.buffer = BUF.crowd; crowdSrc.loop = true; crowdSrc.loopStart = .06; crowdSrc.loopEnd = BUF.crowd.duration - .06;
  crowdGain = AC.createGain(); crowdGain.gain.value = 0; crowdSrc.connect(crowdGain); crowdGain.connect(master); crowdSrc.start(); setCrowd();
}
function setCrowd(boost = 1) { if (crowdGain) crowdGain.gain.setTargetAtTime(save.st.muted || !inGame ? 0 : STADS[save.st.stadium].crowd * .5 * boost, AC.currentTime, .5); }
const sfx = {
  click: () => tone(700, .06, 'sine', .06, 1000),
  throw: p => clip('throw', { vol: .5 + .3 * p, rate: 1.1 + p * .2 }) || tone(300, .2, 'triangle', .05, 900),
  catch: () => clip(pick(['catch1', 'catch2', 'catch3']), { vol: 1, rate: .9 + R() * .2 }) || tone(180, .08, 'square', .08, 90),
  kick: () => clip('kick', { vol: 1, rate: .9 + R() * .15 }) || tone(120, .12, 'square', .1, 60),
  whistle: () => clip('whistle', { vol: .55 }) || tone(2800, .4, 'sine', .05, 2600),
  cheer: (v = 1) => { clip('cheer', { vol: .8 * v }); setCrowd(1.6); setTimeout(() => setCrowd(1), 4000); },

function pullUpdate(e) {

  const dy = p.y - p.y0, dx = p.x - p.x0, full = clamp(innerHeight * .34, 120, 280);
  p.power = clamp(dy / full, 0, 1.15); p.lean = Math.atan2(dx, Math.max(dy, 1));
  const pct = Math.round(p.power * 100), col = pct > 105 ? '#ff4d4d' : pct >= 95 ? '#35d07f' : pct >= 85 ? '#ffd23f' : '#ffffff';
  const gx = parseFloat($('#grab').style.left), gy = parseFloat($('#grab').style.top);
  $('#pull').innerHTML = `<line x1="${gx}" y1="${gy}" x2="${p.x}" y2="${p.y}" stroke="${col}" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 12"/><circle cx="${p.x}" cy="${p.y}" r="18" fill="${col}" fill-opacity=".35" stroke="${col}" stroke-width="3"/>` +
    `<text x="${gx + 64}" y="${gy - 30}" fill="${col}" font-family="Bebas Neue, Impact, sans-serif" font-size="44" stroke="#000" stroke-width="1.2">${pct}%</text>` +
    `<text x="${gx + 64}" y="${gy - 6}" fill="#fff" font-family="Inter, sans-serif" font-weight="800" font-size="13" opacity=".85">${pct > 105 ? 'TOO HARD' : pct >= 95 ? 'PERFECT' : pct >= 85 ? 'ALMOST' : 'PULL MORE'}</text>`;
  if (P.qb) { P.qb.armLock = true; P.qb.arms[0].rotation.x = -1 - p.power * 1.3; }
}
addEventListener('pointermove', e => {
  if (pulling && e.pointerId === pulling.id) return pullUpdate(e);
  if (aimDrag && canAim()) aimAt(e.clientX, e.clientY);
});
addEventListener('pointerup', e => {
  aimDrag = false;
  if (!pulling || e.pointerId !== pulling.id) return;
  const p = pulling; pulling = null; $('#grab').classList.remove('hold'); $('#pull').innerHTML = ''; if (P.qb) P.qb.armLock = false;
  if (p.power < .08) return;
  release(p.power, p.lean);
});
addEventListener('pointercancel', () => { aimDrag = false; pulling = null; $('#pull').innerHTML = ''; $('#grab').classList.remove('hold'); });
function release(power, lean) {
  if (phase === 'live') throwBall(power, lean);
  else if (phase === 'kick') doKick(power, lean);
  else if (phase === 'toss') tossThrow(power, lean);
}
function tossThrow(power, lean) {
  const q = P.qb, p0 = new V3(q.x - .35, REL_H, q.z + .4), dx = aim.x - p0.x, dz = aim.z - p0.z, d = clamp(Math.hypot(dx, dz), 2, 70);
  const th = loftFor(d), v = vNeeded(d, th, aim.y - REL_H) * power;
  const leanDeg = lean / DEG, eff = -Math.sign(leanDeg) * Math.max(0, Math.abs(leanDeg) - 3) * .35 * G_.diff.lean * (1 + Math.max(0, power - 1) * 4);
  const az = Math.atan2(dx, dz) + eff * DEG + (R() - .5) * G_.diff.noise;
  ball.pos.copy(p0); ball.vel.set(Math.sin(az) * Math.cos(th) * v, Math.sin(th) * v, Math.cos(az) * Math.cos(th) * v);
  flight = { p0, pts: [], hitDone: false }; trail.visible = true; sfx.throw(power);
  P.qb.armLock = true; P.qb.arms[0].rotation.x = -2.6; setTimeout(() => { P.qb.arms[0].rotation.x = .4; setTimeout(() => P.qb.armLock = false, 300); }, 60);
  clearAim(); showOnly([]); phase = 'tossflight';
}
addEventListener('keydown', e => { if (e.code === 'Space' && phase === 'presnap') hike(); });

/* ================= camera ================= */
const camPos = new V3(0, 30, -30), camLook = new V3(0, 0, 50); let camYaw = 0;
function povCam(dt, k = 5) { // waist-high, just behind and beside the QB, turning his head toward the aim
  const q = P.qb, port = innerWidth < innerHeight;
  let want = Math.atan2(aim.x - q.x, Math.max(aim.z - q.z, 1)); want = clamp(want, -1.05, 1.05);
  camYaw += (want - camYaw) * clamp(dt * 3.5, 0, 1);
  const fx = Math.sin(camYaw), fz = Math.cos(camYaw), lx = fz, lz = -fx, back = port ? 3.1 : 2.7, side = port ? -.85 : -1.05;
  camTo(q.x - fx * back + lx * side, port ? 2.75 : 2.55, q.z - fz * back + lz * side, q.x + fx * 26 + lx * side * .3, 1.0, q.z + fz * 26, dt, k);
}
function camTo(px, py, pz, lx, ly, lz, dt, k = 3) {
  const f = clamp(dt * k, 0, 1); camPos.lerp(new V3(px, py, pz), f); camLook.lerp(new V3(lx, ly, lz), f);
  camera.position.copy(camPos); camera.lookAt(camLook);
}
function cameraStep(dt) {
  const port = innerWidth < innerHeight, q = P.qb;
  switch (phase) {
    case 'menu': case 'over': { const a = T * .06; camTo(Math.sin(a) * 70, 34, 50 - Math.cos(a) * 90, 0, 0, 50, dt, 1.2); break; }
    case 'playcall': case 'fourth': camTo(0, port ? 16 : 13, q.z - (port ? 20 : 17), 0, 0, q.z + 16, dt, 2.5); break;
    case 'presnap': camTo(q.x * .3, port ? 9.5 : 7.2, q.z - (port ? 12.5 : 10.5), q.x * .2, 0, q.z + (port ? 20 : 17), dt, 3); break;
    case 'live': case 'toss': povCam(dt); break;
    case 'tossflight': case 'flight': if (flight && flight.t < .35) { povCam(dt, 4); break; } camTo(ball.pos.x * .5, Math.max(7, ball.pos.y + 5), ball.pos.z - 13, ball.pos.x, ball.pos.y * .5, ball.pos.z + 6, dt, 2.2); break;
    case 'yac': if (carrier) camTo(carrier.x * .6, 8, carrier.z - 12, carrier.x, 0, carrier.z + 8, dt, 3); break;
    case 'kick': camTo(kick.x0 * .5, port ? 3.4 : 2.8, kick.z0 - (port ? 10 : 8), 0, 4.5, POST_Z, dt, 3); break;
    case 'kickflight': camTo(kick.x0 * .5, 3.2, kick.z0 - 8, ball.pos.x * .5, Math.max(4, ball.pos.y * .6), POST_Z, dt, 2); break;
    case 'dead': if (carrier) camTo(carrier.x * .6, 8, carrier.z - 12, carrier.x, 0, carrier.z + 8, dt, 2); else camTo(camPos.x, camPos.y, camPos.z, ball.pos.x, ball.pos.y * .5, ball.pos.z, dt, 1.5); break;
  }
}

/* ================= lobby ================= */
const MODES = [
  { id: 'game', name: 'Game', sub: '3 drives. Move the chains, score touchdowns, kick extra points.', best: () => save.best.game ? `Best ${save.best.game} pts` : '',
    icon: '<svg viewBox="0 0 48 48"><ellipse cx="24" cy="24" rx="19" ry="11" transform="rotate(-35 24 24)" fill="#8a3f16" stroke="#fff" stroke-width="2"/><path d="M17 31L31 17M20 22l6 6M23 19l6 6M17 25l6 6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>' },
  { id: 'drill', name: 'Two-minute drill', sub: 'Two minutes on the clock. Score as many points as you can.', best: () => save.best.drill ? `Best ${save.best.drill} pts` : '',
    icon: '<svg viewBox="0 0 48 48"><circle cx="24" cy="26" r="16" fill="none" stroke="#ffd23f" stroke-width="3.5"/><path d="M24 26V16M24 26l7 5" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M19 5h10" stroke="#ffd23f" stroke-width="3.5" stroke-linecap="round"/></svg>' },
  { id: 'fg', name: 'Field goals', sub: 'Kick from farther and farther back. Watch the wind. Three misses and you are out.', best: () => save.best.fg ? `Best ${save.best.fg} made · long ${save.best.fgLong}` : '',
    icon: '<svg viewBox="0 0 48 48"><path d="M24 44V26M12 26h24M12 26V6M36 26V6" stroke="#ffd000" stroke-width="3.5" stroke-linecap="round"/><ellipse cx="24" cy="14" rx="5" ry="3.2" fill="#8a3f16" stroke="#fff" stroke-width="1.5"/></svg>' },
  { id: 'toss', name: 'Target toss', sub: 'Ten throws. Fire through the rings. Far and moving rings score more.', best: () => save.best.toss ? `Best ${save.best.toss} pts` : '',
    icon: '<svg viewBox="0 0 48 48"><circle cx="24" cy="20" r="12" fill="none" stroke="#ff5ca8" stroke-width="4"/><path d="M24 32v12" stroke="#d1d5db" stroke-width="3"/><circle cx="24" cy="20" r="3" fill="#ffd23f"/></svg>' }
];
function renderLobby() {
  const st = save.st;
  $('#lobby').innerHTML = `<div class="wrap">
    <div class="brand">GRIDIRON <b>QB</b></div><div class="tag">Pick a play, read the defense, pull back and fire.</div>
    <div class="lab">Mode</div><div class="modes">${MODES.map(m => `<button class="mode ${st.mode === m.id ? 'on' : ''}" data-mode="${m.id}">${m.icon}<b>${m.name}</b><span>${m.sub}</span><em>${m.best()}</em></button>`).join('')}</div>
    <div class="lab">Stadium</div><div class="stads">${Object.entries(STADS).map(([k, s]) => `<button class="stad ${st.stadium === k ? 'on' : ''}" data-stad="${k}"><i style="background:${s.css}"></i><b>${s.name}</b></button>`).join('')}</div>
    <div class="lab">Difficulty</div><div class="seg">${Object.entries(DIFFS).map(([k, d]) => `<button class="${st.diff === k ? 'on' : ''}" data-diff="${k}">${d.name}</button>`).join('')}</div>
    <div class="lab">Your quarterback</div><div class="qbrow"><label>Name on the back<input id="qbName" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="YOUR NAME" value="${st.name}"></label><label>Number<input id="qbNum" inputmode="numeric" maxlength="2" autocomplete="off" value="${st.num}"></label></div>
    <div class="lab">Team color</div><div class="teams">${TEAMS.map((t, i) => `<button class="team ${st.team === i ? 'on' : ''}" data-team="${i}" style="background:linear-gradient(135deg,${t.c} 55%,${t.h} 56%)" aria-label="team color"></button>`).join('')}</div>
    <div class="go"><button class="cta" id="bPlay">Play</button></div>
    <div class="how"><b>How to throw:</b> after the snap, tap a receiver's letter to aim at where he will be (or drag anywhere to aim yourself). Then put your finger on the ball, <b>pull straight back</b> and let go. Pull to <b>100%</b> to hit the spot. Less falls short, more sails long, and pulling sideways sprays the ball. Get rid of it before the pocket bar fills up or you get sacked.
    <br><b>Rookie</b> gives you route lines and receivers that are easier to hit. <b>All-Pro</b> takes the help away.</div>
    <div class="credits">Sounds: CC0 recordings from Freesound (timmyg62, FoolBoyMedia, CHallSmith, SpliceSound, 16HPanskaResatko_Matej, TOMRORYPARSONS, ToastHatter, aidansamuel).</div>
  </div>`;
  const L = $('#lobby');
  L.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { st.mode = b.dataset.mode; persist(); sfx.click(); renderLobby(); });
  L.querySelectorAll('[data-stad]').forEach(b => b.onclick = () => { st.stadium = b.dataset.stad; persist(); sfx.click(); buildWorld(); renderLobby(); });
  L.querySelectorAll('[data-diff]').forEach(b => b.onclick = () => { st.diff = b.dataset.diff; persist(); sfx.click(); renderLobby(); });
  L.querySelectorAll('[data-team]').forEach(b => b.onclick = () => { st.team = +b.dataset.team; persist(); sfx.click(); buildWorld(); renderLobby(); });
  $('#bPlay').onclick = () => { ac(); sfx.click(); startMode(st.mode); };
  let jt = 0; const jerseyChanged = () => { clearTimeout(jt); jt = setTimeout(() => { buildWorld(); allPlayers().forEach(p => p.g.visible = false); ball.g.visible = false; losLine.visible = fdLine.visible = false; }, 350); };
  $('#qbName').oninput = e => { const v = cleanName(e.target.value); if (v !== e.target.value.trim().toUpperCase()) e.target.value = v; st.name = v; persist(); jerseyChanged(); };
  $('#qbNum').oninput = e => { e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 2); if (e.target.value !== '') { st.num = cleanNum(e.target.value); persist(); jerseyChanged(); } };
  $('#qbNum').onblur = e => { e.target.value = st.num; };
}
function toLobby() {
  phase = 'menu'; inGame = false; setCrowd(); clearAim(); showOnly([]); $('#top').hidden = true; $('#lobby').hidden = false;
  for (const h of G_.toss.hoops) world.remove(h.g); G_.toss.hoops = [];
  for (const p of allPlayers()) p.g.visible = false; tee.visible = false; trail.visible = false; losLine.visible = fdLine.visible = false; P.routeLines.forEach(l => l.visible = false);
  renderLobby();
}

/* ================= loop ================= */
let last = performance.now();
function frame(now) {
  const dt = clamp((now - last) / 1000, .001, .05); last = now; T += dt;
  switch (phase) {
    case 'live': liveStep(dt); break;
    case 'flight': flightStep(dt); break;
    case 'yac': yacStep(dt); break;
    case 'kickflight': kickStep(dt); break;
    case 'tossflight': tossStep(dt); break;
    case 'dead':
      if (flight && flight.loose) { ball.vel.y -= G * dt; ball.pos.addScaledVector(ball.vel, dt); if (ball.pos.y < .12) { ball.pos.y = .12; ball.vel.y = Math.abs(ball.vel.y) * .35; ball.vel.x *= .7; ball.vel.z *= .7; } orientBall(dt); }
      if (kick && kick.coast && ball.pos.y > .1) { ball.vel.y -= G * dt; ball.vel.x += kick.wind * .045 * dt; ball.pos.addScaledVector(ball.vel, dt); orientBall(dt, true); }
      [...P.rec, ...P.cb, P.saf].forEach(p => { if (p !== carrier) { p.vx *= .9; p.vz *= .9; p.x += p.vx * dt; p.z += p.vz * dt; } });
      deadTimer -= dt; if (deadTimer <= 0 && afterDead) { const f = afterDead; afterDead = null; if (kick) kick.coast = false; flight = null; carrier = null; f(); }
      break;
  }
  if (phase === 'toss' || phase === 'tossflight' || (phase === 'dead' && G_.mode === 'toss')) tossHoops();
  if (snow) { const a = snow.geometry.attributes.position; for (let i = 0; i < a.count; i++) { let y = a.getY(i) - dt * 2.2; if (y < 0) y += 30; a.setY(i, y); a.setX(i, a.getX(i) + Math.sin(T + i) * dt * .3); } a.needsUpdate = true; snow.position.set(camera.position.x, 0, camera.position.z + 30); }
  if (G_.mode === 'drill' && (phase === 'live' || phase === 'flight' || phase === 'yac')) $('#hRightV').textContent = fmtClock(G_.clock);
  if (sunLight && P.qb) { const cx = phase === 'flight' || phase === 'tossflight' || phase === 'kickflight' ? ball.pos.x : carrier ? carrier.x : P.qb.x, cz = phase === 'flight' || phase === 'tossflight' || phase === 'kickflight' ? ball.pos.z : carrier ? carrier.z : P.qb.z + 12; sunLight.target.position.set(cx, 0, cz); sunLight.position.set(cx - 30, 70, cz - 18); }
  animPlayers(dt); cameraStep(dt); updateOverlays();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ================= boot ================= */
buildWorld(); for (const p of allPlayers()) p.g.visible = false; losLine.visible = fdLine.visible = false; ball.g.visible = false;
renderLobby();
requestAnimationFrame(frame);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (phase === 'menu') buildWorld(), ball.g.visible = false, allPlayers().forEach(p => p.g.visible = false), losLine.visible = fdLine.visible = false; });
window.__qb = {
  get phase() { return phase; }, get G() { return G_; }, get aim() { return aim; }, get P() { return P; }, get kick() { return kick; },
  startMode, choosePlay, hike, toLobby,
  lock(i) { aim.lock = { type: phase === 'toss' ? 'hoop' : 'rec', i }; if (phase === 'live') { const [x, z] = leadFor(P.rec[i]); aim.x = x; aim.z = z; aim.y = CATCH_H; } },
  release, go() { if (phase === 'fourth') $('#bGo').click(); }, fg() { if ($('#bFG')) $('#bFG').click(); }
};
</script>
